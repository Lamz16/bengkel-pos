<html lang="en">
  <head>
    <script>
      (() => {
        const saved = localStorage.getItem('bengkelpro_theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BengkelPro POS</title>

    <meta property="og:title" content="BengkelPro POS" />
    <meta property="og:description" content="Aplikasi POS bengkel modern: kelola servis, stok suku cadang, penomoran SKU & lokasi rak gudang, loyalitas pelanggan & promo otomatis, serta komisi teknisi." />
